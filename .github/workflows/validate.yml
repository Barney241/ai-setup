name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the CLI (runs shellcheck)
        run: nix flake check
      - name: Every skill names itself and has a trigger
        run: |
          for file in skills/*/SKILL.md; do
            dir="$(basename "$(dirname "$file")")"
            grep -qx "name: $dir" "$file" || { echo "$file: name must be $dir"; exit 1; }
            grep -q '^description: ' "$file" || { echo "$file: missing description"; exit 1; }
          done
      - name: Plugin manifests are valid JSON
        run: jq empty .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/hooks/hooks.json plugin/.mcp.json
